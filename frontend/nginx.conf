# ── Opt-1 multi-PWA: one React build, per-host install identity ─────────
# Same dist is served on all hosts; /manifest.json resolves per $host so each
# subdomain installs as its own PWA (own name/icon scope). Served from
# conf.d (inside http context), so map is legal here.
map $host $pwa_manifest {
    default                          /manifest.json;
    employee-igd.ad8ya.cloud         /manifest.employee.json;
    pos-igd.ad8ya.cloud              /manifest.pos.json;
    sr-igd.ad8ya.cloud               /manifest.sr.json;
}

server {
    listen 80;
    server_name localhost igd.ad8ya.cloud pos-igd.ad8ya.cloud sr-igd.ad8ya.cloud;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Per-host PWA identity (Opt-1): /manifest.json resolves via $pwa_manifest map
    location = /manifest.json {
        try_files $pwa_manifest =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache static assets (content-hashed by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker script — ensures SW updates are fetched every time
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        add_header Pragma "no-cache";
    }

    # API proxy - proxy all API calls to backend
    location /api/ {
        set $backend_url "http://backend:3000";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploaded files - served by backend static assets (/app/uploads volume).
    # ^~ so this prefix wins over the static-asset regex above (IGDERP-252:
    # image uploads 404'd because the regex served them from the html dir).
    location ^~ /uploads/ {
        set $backend_url "http://backend:3000";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /socket.io/ {
        set $backend_url "http://backend:3000";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Employee PWA subdomain (IGDERP-274 shell, IGDERP-276 React app) ──
# employee-igd.ad8ya.cloud serves the React build at host root; the app
# boots into /m via HostLanding. Install identity stays "IGD Employee".
# (Legacy 274 mockup files remain under /employee/ in dist, unlinked.)
server {
    listen 80;
    server_name employee-igd.ad8ya.cloud;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Host-root entry + identity files map to the React build (IGDERP-276).
    # / hits index.html -> HostLanding detects the employee host -> /m.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /manifest.json {
        try_files /manifest.employee.json =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /sw.js {
        try_files /sw.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # SPA fallback to the React app
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache static assets (content-hashed by Vite + shared logo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy (same backend as the main host)
    location /api/ {
        set $backend_url "http://backend:3000";
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

